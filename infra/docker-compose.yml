services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-dev-platform-db
    environment:
      POSTGRES_USER: aidev
      POSTGRES_PASSWORD: aidev_local
      POSTGRES_DB: ai_dev_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aidev -d ai_dev_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-dev-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  worker:
    image: ai-dev-platform-backend:latest
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: ai-dev-platform-worker
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql://aidev:aidev_local@postgres:5432/ai_dev_platform
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-change-in-production
      WEB_BASE_URL: http://localhost:5180
      API_PUBLIC_URL: http://localhost:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  api:
    image: ai-dev-platform-backend:latest
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    container_name: ai-dev-platform-api
    environment:
      DATABASE_URL: postgresql://aidev:aidev_local@postgres:5432/ai_dev_platform
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-change-in-production
      WEB_BASE_URL: http://localhost:5180
      API_PUBLIC_URL: http://localhost:8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
